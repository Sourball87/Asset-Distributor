openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Distributor Pricing & Stock Comparison API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: admin
    description: Admin user management
  - name: distributors
    description: Distributor management
  - name: brands
    description: Brand alias management
  - name: uploads
    description: File import pipeline
  - name: comparison
    description: Price/stock comparison grid
  - name: dashboard
    description: Dashboard summary data
  - name: experimental
    description: Experimental / admin-only analytics endpoints

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # --- Auth ---
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Email/password login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Reset email sent (always returned to prevent enumeration)
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using a valid token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/request-access:
    post:
      operationId: requestAccess
      tags: [auth]
      summary: Submit a request for account access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestAccessInput"
      responses:
        "201":
          description: Request submitted
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # --- Admin ---
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users (admin only)
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Update a user's role or status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict (e.g. last admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Remove a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict (e.g. last admin or self)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{id}/reset-password:
    post:
      operationId: resetAdminUserPassword
      tags: [admin]
      summary: Reset a user's password and return a temporary password (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Temporary password generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetResult"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # --- Distributors ---
  /distributors:
    get:
      operationId: listDistributors
      tags: [distributors]
      summary: List all distributors
      responses:
        "200":
          description: List of distributors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Distributor"

    post:
      operationId: createDistributor
      tags: [distributors]
      summary: Create a new distributor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DistributorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Distributor"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /distributors/{id}/uploads:
    delete:
      operationId: deleteDistributorUploads
      tags: [distributors]
      summary: Delete all uploads (and their snapshots) for a distributor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: All uploads deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /distributors/{id}:
    patch:
      operationId: updateDistributor
      tags: [distributors]
      summary: Update a distributor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DistributorUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Distributor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteDistributor
      tags: [distributors]
      summary: Delete a distributor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # --- Brand Aliases ---
  /brands:
    get:
      operationId: listBrands
      tags: [brands]
      summary: List all canonical brands with their aliases
      responses:
        "200":
          description: List of brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"

    post:
      operationId: createBrand
      tags: [brands]
      summary: Create a new canonical brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"

  /brands/{id}:
    patch:
      operationId: updateBrand
      tags: [brands]
      summary: Update a brand and its aliases
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"

    delete:
      operationId: deleteBrand
      tags: [brands]
      summary: Delete a brand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # --- Import Profiles ---
  /distributors/{id}/profile:
    get:
      operationId: getImportProfile
      tags: [uploads]
      summary: Get import profile for a distributor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportProfile"
        "404":
          description: No profile yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      operationId: saveImportProfile
      tags: [uploads]
      summary: Save/update import profile for a distributor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportProfileInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportProfile"

  # --- Uploads ---
  /uploads:
    get:
      operationId: listUploads
      tags: [uploads]
      summary: List uploads (snapshots)
      parameters:
        - name: distributorId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of uploads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Upload"

  /uploads/parse:
    post:
      operationId: parseUpload
      tags: [uploads]
      summary: Parse an uploaded file — returns preview rows + detected columns
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ParseUploadInput"
      responses:
        "200":
          description: Parse preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsePreview"

  /uploads/commit:
    post:
      operationId: commitUpload
      tags: [uploads]
      summary: Commit a parsed upload as a snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitUploadInput"
      responses:
        "201":
          description: Upload committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"

  # --- Comparison Grid ---
  /comparison:
    get:
      operationId: getComparison
      tags: [comparison]
      summary: Get comparison grid data — one row per VPN across all distributors
      parameters:
        - name: brand
          in: query
          required: false
          schema:
            type: string
        - name: distributorId
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Comparison rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonResult"

  # --- Dashboard ---
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard summary — distributor freshness cards + summary tiles
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # --- Experimental (admin-only) ---
  /experimental/cleanup-duplicates:
    post:
      operationId: cleanupDuplicates
      tags: [experimental]
      summary: One-time cleanup — collapse per-warehouse duplicate snapshot rows
      description: >
        Collapses duplicate stock_snapshot rows that were committed before the
        in-import aggregation fix was deployed. Exact-identical groups are
        de-duplicated (keep lowest id). Differing groups are aggregated
        (SUM soh/soo, MIN sell_price, MAX sell_price stored when spread >$1).
        Idempotent — safe to call multiple times.
      responses:
        "200":
          description: Cleanup summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanupResult"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /experimental/movement:
    get:
      operationId: getMovement
      tags: [experimental]
      summary: Stock movement analysis for a single distributor
      description: >
        Returns per-product SOH movement over a look-back window.
        Inference mode is auto-detected (soo_aware when the latest snapshot
        has any nonzero SOO, otherwise soh_only). Admin-only.
      parameters:
        - name: distributorId
          in: query
          required: true
          schema:
            type: integer
        - name: brand
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: excludeBundles
          in: query
          required: false
          description: >
            When true (default), hide VPNs that start with 'CTO' or contain a literal underscore '_'.
            These are typically configure-to-order or bundle line items that distort sell-through metrics.
            Runs on vpn_display (normalization strips underscores from vpn_normalized).
          schema:
            type: boolean
            default: true
        - name: soldOutOnly
          in: query
          required: false
          description: If true, only return products where latest SOH = 0 and estUnitsSold > 0
          schema:
            type: boolean
            default: false
        - name: notCarriedByDicker
          in: query
          required: false
          description: If true, only return products with no Dicker Data snapshot
          schema:
            type: boolean
            default: false
        - name: includeReferenceBrands
          in: query
          required: false
          description: >
            When true, include products belonging to reference-only brands.
            Default false (reference brands hidden from movement view).
          schema:
            type: boolean
            default: false
        - name: activeOnly
          in: query
          required: false
          description: When true (default), exclude products with no SOH, SOO, or movement in any snapshot within the window
          schema:
            type: boolean
            default: true
        - name: sortBy
          in: query
          required: false
          description: Column to sort by (server-side, applied before pagination)
          schema:
            type: string
            enum: [vpn, brand, desc, soh, price, estWeeklyST, estWeeklyRevenue]
            default: estWeeklyRevenue
        - name: sortDir
          in: query
          required: false
          description: Sort direction
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Movement result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementResult"
        "400":
          description: Missing or invalid distributorId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /experimental/market-price:
    get:
      operationId: getMarketPrice
      summary: Find cross-brand equivalent products for a given product ID
      description: >
        Search a SKU and see comparable products from other brands across all
        distributor feeds, with market pricing. Admin-only, results are cached
        for 7 days.
      tags: [experimental]
      security: [{ session: [] }]
      parameters:
        - name: productId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match result (may be served from cache)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPriceResult"
        "429":
          description: Daily LLM call cap exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Matching service unavailable (timeout or API error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /experimental/market-price/by-spec:
    post:
      operationId: getMarketPriceBySpec
      summary: Find cross-brand equivalent products for a free-text specification
      description: >
        Search a SKU and see comparable products from other brands across all
        distributor feeds, with market pricing. Admin-only, results are cached
        for 7 days.
      tags: [experimental]
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketPriceBySpecInput"
      responses:
        "200":
          description: Match result (may be served from cache)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPriceResult"
        "429":
          description: Daily LLM call cap exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Matching service unavailable (timeout or API error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # --- Auth ---
    User:
      type: object
      required: [id, email, name, role, status, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
        status:
          type: string
        createdAt:
          type: string

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RequestAccessInput:
      type: object
      required: [email, name, password]
      properties:
        email:
          type: string
        name:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8

    # --- Admin ---
    AdminUser:
      type: object
      required: [id, email, name, role, status, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
        status:
          type: string
        createdAt:
          type: string
        lastLoginAt:
          type: ["string", "null"]

    AdminUserUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [admin, superuser, user]
        status:
          type: string
          enum: [active, pending]

    PasswordResetResult:
      type: object
      required: [temporaryPassword]
      properties:
        temporaryPassword:
          type: string

    # --- Distributors ---
    Distributor:
      type: object
      required: [id, name, isBaseline, stalenessThresholdDays, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        isBaseline:
          type: boolean
        stalenessThresholdDays:
          type: integer
        createdAt:
          type: string
        lastUploadAt:
          type: ["string", "null"]
        lastUploadStatus:
          type: ["string", "null"]

    DistributorInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        isBaseline:
          type: boolean
        stalenessThresholdDays:
          type: integer

    DistributorUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        isBaseline:
          type: boolean
        stalenessThresholdDays:
          type: integer

    # --- Brands ---
    Brand:
      type: object
      required: [id, canonicalName, aliases, referenceOnly]
      properties:
        id:
          type: integer
        canonicalName:
          type: string
        aliases:
          type: array
          items:
            type: string
        referenceOnly:
          type: boolean
          description: >
            When true, this brand is imported for market-price matching only and
            is hidden from comparison grid, insights, exports, and brand dropdowns.

    BrandInput:
      type: object
      required: [canonicalName, aliases]
      properties:
        canonicalName:
          type: string
          minLength: 1
        aliases:
          type: array
          items:
            type: string
        referenceOnly:
          type: boolean
          default: false

    BrandUpdate:
      type: object
      properties:
        canonicalName:
          type: string
          minLength: 1
        aliases:
          type: array
          items:
            type: string
        referenceOnly:
          type: boolean

    # --- Import Profiles ---
    ColumnMapping:
      type: object
      required: [vpn, brand, description, sell_price, soh]
      properties:
        vpn:
          type: string
        brand:
          type: string
        description:
          type: string
        sell_price:
          type: string
        soh:
          type: string
        soo:
          type: ["string", "null"]

    ImportProfile:
      type: object
      required: [id, distributorId, sourceFormat, headerRowIndex, mapping, createdAt, updatedAt]
      properties:
        id:
          type: integer
        distributorId:
          type: integer
        sourceFormat:
          type: string
          enum: [xlsx, txt]
        delimiter:
          type: ["string", "null"]
        headerRowIndex:
          type: integer
        mapping:
          $ref: "#/components/schemas/ColumnMapping"
        createdAt:
          type: string
        updatedAt:
          type: string

    ImportProfileInput:
      type: object
      required: [sourceFormat, headerRowIndex, mapping]
      properties:
        sourceFormat:
          type: string
          enum: [xlsx, txt]
        delimiter:
          type: ["string", "null"]
        headerRowIndex:
          type: integer
        mapping:
          $ref: "#/components/schemas/ColumnMapping"

    # --- Uploads ---
    Upload:
      type: object
      required: [id, distributorId, filename, uploadedAt, snapshotDate, rowCountTotal, rowCountMatched, status]
      properties:
        id:
          type: integer
        distributorId:
          type: integer
        distributorName:
          type: string
        filename:
          type: string
        uploadedAt:
          type: string
        snapshotDate:
          type: string
        rowCountTotal:
          type: integer
        rowCountMatched:
          type: integer
        status:
          type: string
          enum: [parsing, mapped, committed, failed]

    ParseUploadInput:
      type: object
      properties:
        distributorId:
          type: integer
        headerRowIndex:
          type: integer
        delimiter:
          type: string

    ParsePreview:
      type: object
      required: [columns, rows, rowCountTotal, rowCountMatched, hasProfile, tempFileKey]
      properties:
        tempFileKey:
          type: string
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        rowCountTotal:
          type: integer
        rowCountMatched:
          type: integer
        hasProfile:
          type: boolean
        detectedDelimiter:
          type: ["string", "null"]
        detectedDistributorId:
          type: ["integer", "null"]
        detectedDistributorName:
          type: ["string", "null"]
        detectedMapping:
          $ref: "#/components/schemas/ColumnMapping"
        profile:
          $ref: "#/components/schemas/ImportProfile"

    CommitUploadInput:
      type: object
      required: [distributorId, tempFileKey, mapping, sourceFormat, headerRowIndex]
      properties:
        distributorId:
          type: integer
        tempFileKey:
          type: string
        mapping:
          $ref: "#/components/schemas/ColumnMapping"
        sourceFormat:
          type: string
          enum: [xlsx, txt]
        delimiter:
          type: ["string", "null"]
        headerRowIndex:
          type: integer
        snapshotDate:
          type: string
        saveProfile:
          type: boolean

    # --- Comparison ---
    DistributorStockEntry:
      type: object
      required: [distributorId, distributorName, isBaseline]
      properties:
        distributorId:
          type: integer
        distributorName:
          type: string
        isBaseline:
          type: boolean
        sellPrice:
          type: ["number", "null"]
        soh:
          type: ["integer", "null"]
        soo:
          type: ["integer", "null"]
        movement:
          type: ["integer", "null"]
        movementSinceDate:
          type: ["string", "null"]
        isNew:
          type: boolean
        priceDelta:
          type: ["number", "null"]
        priceDeltaPct:
          type: ["number", "null"]

    ComparisonRow:
      type: object
      required: [productId, vpnNormalized, vpnDisplay, brand, description, distributors, cheapestCompetitorId, dickerIsMostExpensive]
      properties:
        productId:
          type: integer
        vpnNormalized:
          type: string
        vpnDisplay:
          type: string
        brand:
          type: string
        description:
          type: string
        distributors:
          type: array
          items:
            $ref: "#/components/schemas/DistributorStockEntry"
        cheapestCompetitorId:
          type: ["integer", "null"]
        dickerIsMostExpensive:
          type: boolean

    ComparisonResult:
      type: object
      required: [rows, distributors, total]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ComparisonRow"
        distributors:
          type: array
          items:
            $ref: "#/components/schemas/Distributor"
        total:
          type: integer
        page:
          type: ["integer", "null"]
        pageSize:
          type: ["integer", "null"]

    # --- Dashboard ---
    DistributorCard:
      type: object
      required: [distributorId, name, isBaseline, stalenessThresholdDays, freshness]
      properties:
        distributorId:
          type: integer
        name:
          type: string
        isBaseline:
          type: boolean
        stalenessThresholdDays:
          type: integer
        lastUploadAt:
          type: ["string", "null"]
        lastUploadDate:
          type: ["string", "null"]
        freshness:
          type: string
          enum: [fresh, stale_warn, stale_critical, no_data]

    DashboardSummary:
      type: object
      required: [distributorCards, totalProducts, dickerMostExpensiveCount, totalNetMovement]
      properties:
        distributorCards:
          type: array
          items:
            $ref: "#/components/schemas/DistributorCard"
        totalProducts:
          type: integer
        dickerMostExpensiveCount:
          type: integer
        totalNetMovement:
          type: integer

    # --- Experimental ---
    CleanupResult:
      type: object
      required: [ok, rowsDeleted, remainingDuplicateGroups]
      properties:
        ok:
          type: boolean
        rowsDeleted:
          type: integer
        remainingDuplicateGroups:
          type: object
          required: [exactIdentical, differing]
          properties:
            exactIdentical:
              type: integer
            differing:
              type: integer

    MovementSnapshot:
      type: object
      required: [snapshotDate]
      properties:
        snapshotDate:
          type: string
        soh:
          type: ["integer", "null"]
        soo:
          type: ["integer", "null"]
        sellPrice:
          type: ["number", "null"]

    PriceSpreadFlag:
      type: object
      required: [minPrice, maxPrice]
      properties:
        minPrice:
          type: number
        maxPrice:
          type: number

    # --- Market Price ---
    MarketPriceBySpecInput:
      type: object
      required: [specText]
      properties:
        specText:
          type: string
          description: Free-text specification to match against
        maxPrice:
          type: number
          nullable: true
          description: Optional price ceiling (sell price)

    MarketPriceDistributorPrice:
      type: object
      required: [distributorId, distributorName, sellPrice, snapshotDate]
      properties:
        distributorId:
          type: integer
        distributorName:
          type: string
        sellPrice:
          type: ["number", "null"]
        snapshotDate:
          type: string

    MarketPriceMatch:
      type: object
      required: [productId, brand, vpnDisplay, description, similarity, reason, prices]
      properties:
        productId:
          type: integer
        brand:
          type: string
        vpnDisplay:
          type: string
        description:
          type: string
        similarity:
          type: string
          enum: [close, partial, related]
        reason:
          type: string
        prices:
          type: array
          items:
            $ref: "#/components/schemas/MarketPriceDistributorPrice"

    MarketPriceSourceSummary:
      type: object
      required: [productId, brand, vpnDisplay, description, prices]
      properties:
        productId:
          type: ["integer", "null"]
        brand:
          type: ["string", "null"]
        vpnDisplay:
          type: ["string", "null"]
        description:
          type: string
        prices:
          type: array
          items:
            $ref: "#/components/schemas/MarketPriceDistributorPrice"

    MarketPriceResult:
      type: object
      required: [source, matches, cached, model, candidatesEvaluated]
      properties:
        source:
          $ref: "#/components/schemas/MarketPriceSourceSummary"
        matches:
          type: array
          items:
            $ref: "#/components/schemas/MarketPriceMatch"
        cached:
          type: boolean
        model:
          type: string
        candidatesEvaluated:
          type: integer

    MovementProduct:
      type: object
      required: [productId, vpnNormalized, vpnDisplay, brand, description, snapshots, snapshotCount, daysCovered, estUnitsSold, soldOut, dickerStatus]
      properties:
        productId:
          type: integer
        vpnNormalized:
          type: string
        vpnDisplay:
          type: string
        brand:
          type: string
        description:
          type: string
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/MovementSnapshot"
          description: In-window snapshots ASC — used to render sparkline
        latestSoh:
          type: ["integer", "null"]
        latestSellPrice:
          type: ["number", "null"]
        snapshotCount:
          type: integer
          description: Number of in-window snapshots for this product
        daysCovered:
          type: integer
          description: Calendar days between first and last in-window snapshot date
        estUnitsSold:
          type: integer
          description: Lower-bound estimate of units sold by this competitor over the window
        estWeeklyST:
          type: ["number", "null"]
          description: >
            Weekly sell-through rate = estUnitsSold / daysCovered * 7, rounded to 1 dp.
            Null when snapshotCount < 2 or daysCovered < 7 (insufficient data).
        estWeeklyRevenue:
          type: ["number", "null"]
          description: estWeeklyST * latestSellPrice; null when estWeeklyST or price is null
        soldOut:
          type: boolean
          description: latestSoh == 0 AND estUnitsSold > 0
        dickerStatus:
          type: string
          enum: [stocked, listed, not carried]
          description: Dicker Data stock posture for this product

    MovementDataQuality:
      type: object
      required: [snapshotCount, dateRange, bundlesExcluded]
      properties:
        snapshotCount:
          type: integer
          description: Number of distinct snapshot dates in the window for this distributor
        dateRange:
          type: object
          required: [from, to]
          properties:
            from:
              type: ["string", "null"]
            to:
              type: ["string", "null"]
        bundlesExcluded:
          type: integer
          description: >
            Count of products matching the bundle/CTO heuristic (vpn_display ILIKE 'CTO%'
            OR STRPOS(vpn_display, '_') > 0). Shown regardless of excludeBundles flag
            so PMs can sanity-check for false positives.

    MovementResult:
      type: object
      required: [distributorId, distributorName, inferenceMode, dataQuality, products, total, limit, offset]
      properties:
        distributorId:
          type: integer
        distributorName:
          type: string
        inferenceMode:
          type: string
          enum: [soh_only, soo_aware]
        dataQuality:
          $ref: "#/components/schemas/MovementDataQuality"
        products:
          type: array
          items:
            $ref: "#/components/schemas/MovementProduct"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
